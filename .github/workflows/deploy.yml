name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: imdb-sentiment-api
  ECR_REGISTRY: 262045878835.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::262045878835:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0bb42cb6436768d65 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 262045878835.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 262045878835.dkr.ecr.ap-south-1.amazonaws.com/imdb-sentiment-api:${{ github.sha }}",
              "docker stop imdb-sentiment-api || true",
              "docker rm imdb-sentiment-api || true",
              "docker run -d --name imdb-sentiment-api -p 8000:8000 -e MODEL_PATH=roshan0ai/imdb-sentiment-bert 262045878835.dkr.ecr.ap-south-1.amazonaws.com/imdb-sentiment-api:${{ github.sha }}",
              "docker image prune -af"
            ]' \
            --comment "Deploy IMDb sentiment API ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0bb42cb6436768d65 \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "Deployment failed."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0bb42cb6436768d65
              exit 1
            fi

            sleep 10
          done

          echo "Deployment did not finish within the expected time."
          exit 1